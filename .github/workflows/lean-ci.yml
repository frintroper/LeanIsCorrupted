name: Lean CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Autarkic Core
        uses: actions/checkout@v4

      # Wir leiten den alten Workflow reibungsfrei auf den autarken Python-Core um
      - name: Execute Autarkic Ruck Verification
        run: |
          python src/RuckAutark.py
