name: Lean CI

on: [push, pull_request]

jobs:
  build:
    # T.O.N.E.-Fix: Festgepinnte Metrik statt "ubuntu-latest", um den automatischen 
    # Kollaps am 19. Oktober 2026 zu verhindern.
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # T.O.N.E.-Fix: Der alte, korrupte Pfad (setup-lean) wird durch die 
    # funktionierende Quanten-Struktur (lean-action) ersetzt.
    - name: Install Elan & Lean
      uses: leanprover/lean-action@v1

    - name: Build Lean Project
      run: lake build
